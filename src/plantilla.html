<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8172c">
<meta name="description" content="Preparación de la oposición de Maquinista de Tracción Eléctrica de Metro de Madrid.">
<title>Oposición Metro de Madrid — Maquinista</title>
<link rel="canonical" href="https://oposicion-metro.pages.dev/">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="__ICONO__">
<link rel="icon" href="__ICONO__">
<style>
/* =====================================================================
   Lenguaje visual: señalética de metro.
   Numeración en círculo, líneas de color, diagramas de estaciones.
   ===================================================================== */
:root{
  --bg:#f7f3eb; --surface:#fffdf8; --surface-2:#efe8dc; --text:#18202b; --muted:#66707a;
  --border:#ded5c8; --accent:#c8172c; --accent-2:#123a63; --accent-ink:#ffffff; --accent-soft:#f8e3e5;
  --ok:#176b42; --ok-soft:#e5f2e9; --err:#b4232d; --err-soft:#f9e7e8;
  --warn:#795100; --warn-soft:#f7edcf;
  --rojo-metro:#c8172c; --azul-metro:#123a63;
  --radius:14px; --shadow:0 1px 2px rgba(48,38,25,.07),0 8px 24px rgba(48,38,25,.06);
  --tap:52px; --linea:var(--accent);
}
html[data-tema="oscuro"]{
  --bg:#0c1018; --surface:#171c25; --surface-2:#222a36; --text:#f6f0e6; --muted:#b9b4aa;
  --border:#343c48; --accent:#ff5365; --accent-2:#91bde8; --accent-ink:#170509; --accent-soft:#3a2028;
  --ok:#61c990; --ok-soft:#142a21; --err:#ff7f89; --err-soft:#351c22;
  --warn:#e7bd64; --warn-soft:#2d2718;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:400 17px/1.58 Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:820px;margin:0 auto;padding:12px 18px 96px}
h1,h2,h3{line-height:1.2;margin:0 0 .45em;letter-spacing:-.022em;font-weight:800}
h1{font-size:1.8rem} h2{font-size:1.48rem} h3{font-size:1.08rem}
p{margin:0 0 1em}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
#app:focus{outline:none}

/* ---------- barra superior: banda de señalética ---------- */
.top{
  display:flex;align-items:center;gap:10px;min-height:66px;margin:0 -18px 22px;padding:8px 18px;
  background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:30
}
.top .titulo{font-weight:800;font-size:1rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.018em;margin:0}
.iconbtn{
  min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;
  background:transparent;border:0;border-radius:50%;cursor:pointer
}
.iconbtn:active{transform:scale(.95)}
.marca{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.marca-propia{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);font-weight:850;font-size:.92rem;letter-spacing:-.04em}
.ico{width:1.15em;height:1.15em;display:inline-block;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn .ico{width:20px;height:20px}
.sprite-iconos{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- indicador de línea (círculo numerado) ---------- */
.roundel{
  width:46px;height:46px;border-radius:50%;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:1.18rem;letter-spacing:-.03em;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.28)
}
.roundel.pequeno{width:34px;height:34px;font-size:.92rem;box-shadow:inset 0 0 0 2px rgba(255,255,255,.28)}

/* ---------- rótulo de señalética ---------- */
.rotulo{font-size:.76rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.seccion-tit{font-size:.78rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:26px 0 11px}

/* ---------- botones ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  min-height:var(--tap);padding:12px 18px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface);cursor:pointer;
  font-size:1rem;font-weight:750;text-align:center;box-shadow:none;
  transition:transform .08s ease, background .15s ease;letter-spacing:-.01em
}
.btn:active{transform:scale(.985)}
.btn.primario{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.sutil{background:transparent;box-shadow:none;font-weight:600;color:var(--muted)}
.btn.peligro{color:var(--err);border-color:var(--err)}
.btn[disabled]{opacity:.45;pointer-events:none}
.fila{display:flex;gap:10px;flex-wrap:wrap}
.fila>*{flex:1 1 130px}

/* ---------- menú principal ---------- */
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.menu .btn{justify-content:flex-start;align-items:flex-start;text-align:left;min-height:104px;padding:15px;position:relative;overflow:hidden}
.menu .icono-menu{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--surface-2);color:var(--accent-2)}
.menu .icono-menu .ico{width:19px;height:19px}
.menu .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.menu .txt b{font-size:1rem;font-weight:800;letter-spacing:-.02em}
.menu .txt span{font-size:.83rem;font-weight:450;color:var(--muted);line-height:1.42}
.menu .btn.primario .txt span{color:rgba(255,255,255,.86)}
html[data-tema="oscuro"] .menu .btn.primario .txt span{color:rgba(8,17,28,.78)}
.menu .btn.primario .icono-menu{background:rgba(255,255,255,.18);color:inherit}

/* ---------- tarjetas ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:none;margin-bottom:14px}
.card.plano{box-shadow:none}
.card.rail{border-left:6px solid var(--linea);padding-left:18px}
.aviso{background:var(--warn-soft);border:1px solid transparent;border-left:5px solid var(--warn);border-radius:11px;padding:12px 14px;font-size:.92rem;margin:0 0 14px}
.aviso.info{background:var(--accent-soft);border-left-color:var(--accent)}
.aviso.compacto{display:flex;align-items:flex-start;gap:10px;margin-top:16px;font-size:.82rem;color:var(--muted);background:var(--surface-2);border-left-color:var(--accent)}
.aviso.compacto .ico{color:var(--accent);margin-top:2px}

/* ---------- portada ---------- */
.hero{
  position:relative;margin-bottom:22px;color:var(--text)
}
.hero .saludo{font-size:clamp(1.72rem,5vw,2.35rem);font-weight:850;line-height:1.08;letter-spacing:-.04em;margin:4px 0 9px}
.hero .entradilla{color:var(--muted);max-width:610px;margin:0;line-height:1.52}
.ruta-card{position:relative;overflow:hidden;margin:20px 0 0;padding:17px 17px 16px;background:var(--surface);border:1px solid var(--border);border-radius:15px}
.ruta-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.ruta-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-left:2px}
.ruta-cab b{font-size:.94rem}
.ruta-cifra{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--accent);color:var(--accent-ink);font-size:1.03rem;font-weight:850}
.ruta-estaciones{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin:18px 1px 3px}
.ruta-estaciones::before{content:"";position:absolute;left:9%;right:9%;top:7px;height:4px;background:var(--border)}
.ruta-estacion{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:.69rem}
.ruta-estacion i{display:block;width:18px;height:18px;margin:0 auto 6px;border:4px solid var(--surface);border-radius:50%;background:var(--border);box-shadow:0 0 0 2px var(--border)}
.ruta-estacion.actual{color:var(--text);font-weight:800}
.ruta-estacion.actual i{background:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.hero .btn{width:auto;margin-top:18px;padding-inline:20px}
.hero .rachah{font-size:.82rem;color:var(--muted);margin:11px 0 0}
.racha{font-size:.89rem;color:var(--muted);margin-top:2px}
.cab-seccion{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 11px}
.cab-seccion h2{font-size:1.08rem;margin:0}
.cab-seccion span{font-size:.8rem;color:var(--muted)}
.extra-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.extra-nav .btn{min-height:46px;padding:10px 8px;background:transparent;border-color:transparent;color:var(--muted);font-size:.8rem;box-shadow:none}
.extra-nav .ico{width:17px;height:17px}

/* ---------- listas ---------- */
.lista{display:grid;gap:10px}
.item{
  display:flex;align-items:center;gap:14px;width:100%;min-height:var(--tap);
  padding:13px 15px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--surface);cursor:pointer;text-align:left;box-shadow:none
}
.item:active{transform:scale(.99)}
.item .cod{
  flex:0 0 auto;min-width:44px;height:34px;display:inline-flex;align-items:center;justify-content:center;
  background:var(--surface-2);border-radius:9px;font-size:.85rem;font-weight:800;color:var(--muted);padding:0 8px
}
.item .cod .ico{width:18px;height:18px}
.item .cod.color{color:#fff}
.item .cuerpo{flex:1;min-width:0}
.item .cuerpo b{display:block;font-weight:700;font-size:1rem;letter-spacing:-.015em}
.item .cuerpo small{color:var(--muted);font-size:.84rem}
.item .flecha{color:var(--muted);flex:0 0 auto;font-size:1.2rem}

/* ---------- diagrama de línea: los temas como estaciones ---------- */
.diagrama{display:block;margin:2px 0 6px}
.estacion{
  display:flex;gap:14px;width:100%;background:none;border:0;padding:0;cursor:pointer;
  text-align:left;color:inherit;align-items:stretch
}
.estacion .raiz{position:relative;width:36px;flex:0 0 36px}
.estacion .raiz::before{
  content:"";position:absolute;left:50%;transform:translateX(-50%);
  top:0;bottom:0;width:7px;background:var(--linea);border-radius:4px
}
.estacion:first-of-type .raiz::before{top:24px}
.estacion:last-of-type .raiz::before{bottom:auto;height:24px}
.estacion .parada{
  position:absolute;left:50%;top:24px;transform:translate(-50%,-50%);
  width:19px;height:19px;border-radius:50%;background:var(--surface);
  border:5px solid var(--linea);z-index:2;transition:background .2s ease
}
.estacion.hecha .parada{background:var(--linea);box-shadow:0 0 0 4px var(--accent-soft)}
.estacion .caja{
  flex:1;min-width:0;margin-bottom:11px;padding:13px 15px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--border);box-shadow:none;
  display:flex;align-items:center;gap:12px
}
.estacion:active .caja{transform:scale(.99)}
.estacion .caja .cuerpo{flex:1;min-width:0}
.estacion .caja b{display:block;font-weight:700;font-size:1rem;letter-spacing:-.015em}
.estacion .caja small{color:var(--muted);font-size:.84rem}
.estacion .caja .flecha{color:var(--muted);font-size:1.2rem}

/* ---------- barras de progreso ---------- */
.barra{height:9px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--linea);border-radius:99px;transition:width .5s ease}
.linea-parte{height:7px;border-radius:99px;margin:2px 0 16px;background:var(--linea)}
.punto{display:inline-block;width:11px;height:11px;border-radius:50%;flex:0 0 auto;margin-right:9px}

/* ---------- preguntas ---------- */
.contador{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.86rem;color:var(--muted);margin-bottom:8px}
.contador .rotulo{font-size:.76rem}
.enunciado{font-size:1.19rem;font-weight:700;line-height:1.42;margin:6px 0 18px;letter-spacing:-.015em}
.opciones{display:grid;gap:10px}
.op{
  display:flex;align-items:flex-start;gap:13px;width:100%;min-height:var(--tap);
  padding:13px 15px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);cursor:pointer;text-align:left;font-size:1.01rem;line-height:1.42;color:inherit
}
.op:hover:not([disabled]){border-color:var(--accent)}
.op .tecla{
  flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--surface-2);
  display:inline-flex;align-items:center;justify-content:center;font-size:.88rem;font-weight:800;color:var(--muted)
}
.op[disabled]{cursor:default}
.op.correcta{border-color:var(--ok);background:var(--ok-soft)}
.op.correcta .tecla{background:var(--ok);color:#fff}
.op.fallada{border-color:var(--err);background:var(--err-soft)}
.op.fallada .tecla{background:var(--err);color:#fff}
.op.marcada{border-color:var(--accent);background:var(--accent-soft)}
.op.marcada .tecla{background:var(--accent);color:var(--accent-ink)}
@keyframes acierto{0%{transform:scale(1)}40%{transform:scale(1.022)}100%{transform:scale(1)}}
@keyframes fallo{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.anim-ok{animation:acierto .34s ease}
.anim-err{animation:fallo .38s ease}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
  .anim-ok,.anim-err{animation:none}.btn:active,.item:active,.iconbtn:active,.estacion:active .caja{transform:none}
}

.feedback{margin-top:16px;border-radius:12px;padding:15px 16px;border:1px solid var(--border);border-left-width:5px}
.feedback.bien{background:var(--ok-soft);border-color:var(--ok)}
.feedback.mal{background:var(--err-soft);border-color:var(--err)}
.feedback.bien:focus-visible{outline-color:var(--ok)}
.feedback.mal:focus-visible{outline-color:var(--err)}
.feedback .cab{font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.feedback .cab .ico{width:19px;height:19px}
.feedback .exp{font-size:.96rem;line-height:1.58}
.fuente{font-size:.83rem;color:var(--muted);margin-top:10px;word-break:break-word}
.fuente a{color:var(--muted)}
.fuente-enlace{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fuente-enlace .ico{width:16px;height:16px}
.chip-volatil{display:inline-block;background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:3px 11px;font-size:.77rem;font-weight:700;margin-bottom:10px}

/* ---------- fichas ---------- */
.ficha{
  min-height:230px;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:28px 22px;font-size:1.18rem;line-height:1.5;cursor:pointer;user-select:none;
  width:100%;color:inherit;background:var(--surface);border:2px dashed var(--border);border-radius:16px;font-weight:600
}
.ficha.girada{border-style:solid;border-color:var(--linea);background:var(--accent-soft);font-weight:500}
.ficha-pista{text-align:center;color:var(--muted);font-size:.87rem;margin:10px 0 16px}

/* ---------- resultado ---------- */
.nota{text-align:center;padding:10px 0 4px}
.nota .valor{font-size:3.7rem;font-weight:820;line-height:1;letter-spacing:-.04em}
.nota .valor.bien{color:var(--ok)} .nota .valor.mal{color:var(--err)}
.nota .sub{color:var(--muted);font-size:1rem;margin-top:6px}
.veredicto{display:inline-block;padding:8px 20px;border-radius:99px;font-weight:800;margin-top:12px;letter-spacing:.02em}
.veredicto.bien{background:var(--ok-soft);color:var(--ok)} .veredicto.mal{background:var(--err-soft);color:var(--err)}
.tabla{width:100%;border-collapse:collapse;font-size:.94rem}
.tabla th,.tabla td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--border)}
.tabla th{font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
.tabla td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- resumen de estudio ---------- */
.md{font-size:1.05rem;line-height:1.72}
.md h2{font-size:1.04rem;margin:1.35em 0 .4em;font-weight:800;letter-spacing:-.015em}
.md ul{padding-left:1.25em;margin:0 0 1em}
.md li{margin-bottom:.5em}
.md li::marker{color:var(--linea)}
.md strong{font-weight:750}
.md em{font-style:italic}
.md .tabla-env{overflow-x:auto;margin:0 0 1.1em;-webkit-overflow-scrolling:touch}
.md .tabla{font-size:.95rem;min-width:100%}
.md .tabla td:first-child{font-weight:600}
.card.figura{padding:16px 14px;overflow-x:auto}
.card.figura svg{max-width:100%}
.md .nota-md{
  border-left:5px solid var(--linea);background:var(--surface-2);
  padding:11px 14px;border-radius:0 10px 10px 0;margin:0 0 1.1em;font-size:.99rem
}

/* ---------- buscador ---------- */
.buscador{
  width:100%;min-height:56px;padding:14px 16px;font:inherit;
  background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px
}
.vacio{text-align:center;color:var(--muted);padding:36px 12px}
.fin-icono{width:52px;height:52px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ok-soft);color:var(--ok)}
.fin-icono .ico{width:26px;height:26px}

/* ---------- cronómetro ---------- */
.crono{font-variant-numeric:tabular-nums;font-weight:800;background:var(--surface-2);padding:5px 12px;border-radius:99px;font-size:.93rem}
.crono.rojo{background:var(--err-soft);color:var(--err)}

/* ---------- gráfica ---------- */
.grafica{width:100%;height:auto;display:block;overflow:visible}

/* ---------- psicotécnicos ---------- */
.serie{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:18px 0 6px}
.serie span{
  min-width:62px;padding:12px 10px;background:var(--surface-2);border-radius:11px;
  text-align:center;font-size:1.22rem;font-weight:800;font-variant-numeric:tabular-nums
}
.serie span.hueco{background:var(--accent-soft);color:var(--accent);border:2px dashed var(--accent)}
.figs{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;margin:16px 0}
.fig{background:var(--surface-2);border-radius:11px;padding:8px}

/* ---------- navegación del simulacro ---------- */
.mapa-preguntas{margin:10px 0 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:9px 12px}
.mapa-preguntas summary{cursor:pointer;font-size:.88rem;font-weight:700;color:var(--muted);min-height:44px;display:flex;align-items:center}
.rejilla-preguntas{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px;padding:7px 0 4px}
.salto-pregunta{min-width:44px;min-height:44px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);font:700 .86rem/1 system-ui;cursor:pointer}
.salto-pregunta.respondida{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.salto-pregunta.actual{outline:3px solid var(--accent);outline-offset:1px}

.pie{position:fixed;left:0;right:0;bottom:0;background:var(--surface);background:color-mix(in srgb,var(--surface) 94%,transparent);border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:20;backdrop-filter:blur(12px)}
.pie .wrap-pie{max-width:780px;margin:0 auto}
.oculto{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:560px){
  .wrap{padding-inline:14px}.top{margin-inline:-14px;padding-inline:14px;margin-bottom:18px}
  .menu{grid-template-columns:1fr}.menu .btn{min-height:84px}
  .hero .btn{width:100%}.extra-nav{grid-template-columns:1fr;gap:2px}.extra-nav .btn{justify-content:flex-start;padding-inline:8px}
  .ruta-estacion{font-size:.63rem}.cab-seccion{margin-top:24px}
}
</style>
</head>
<body>
<svg class="sprite-iconos" aria-hidden="true" focusable="false">
