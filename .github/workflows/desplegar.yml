name: Compilar y desplegar

on:
  push:
    branches: [main]
    paths:
      - 'contenido/**'
      - 'src/**'
      - 'tests/**'
      - 'build.js'
      - '.github/workflows/desplegar.yml'
  workflow_dispatch:

concurrency:
  group: despliegue-paginas
  cancel-in-progress: true

jobs:
  compilar:
    name: Compilar y validar una sola vez
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Comprobar que los JSON coinciden con sus ficheros fuente
        run: |
          node contenido/fuente/_fusionar.js
          if ! git diff --quiet -- contenido/temario.json contenido/preguntas.json; then
            echo "✖ Los JSON de contenido no coinciden con contenido/fuente/parte-*.js."
            echo "  Ejecuta en local: node contenido/fuente/_fusionar.js && node build.js"
            git --no-pager diff --stat -- contenido/temario.json contenido/preguntas.json
            exit 1
          fi
          echo "✔ Contenido sincronizado."

      - name: Compilar y validar contenido y aislamiento de red
        run: node build.js

      - name: Comprobar que la compilación es reproducible
        run: |
          antes=$(find dist -type f -print0 | sort -z | xargs -0 sha256sum)
          node build.js >/tmp/segunda-compilacion.log
          despues=$(find dist -type f -print0 | sort -z | xargs -0 sha256sum)
          test "$antes" = "$despues" || {
            echo "✖ Dos compilaciones del mismo código no producen los mismos bytes."
            diff <(printf '%s\n' "$antes") <(printf '%s\n' "$despues") || true
            exit 1
          }
          echo "✔ Compilación reproducible byte a byte."

      - name: Someter los generadores a 300.000 casos
        run: node tests/psicotecnicos.test.js 100000

      - name: Comprobar migraciones y posiciones de respuesta
        run: node tests/migraciones.test.js

      - name: Probar preguntas y generadores en un navegador real
        run: |
          python3 -m http.server 8765 --directory dist/web >/tmp/oposicion-http.log 2>&1 &
          servidor=$!
          trap 'kill "$servidor" 2>/dev/null || true' EXIT
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=20000 \
            --dump-dom 'http://127.0.0.1:8765/?autotest=10000' > /tmp/autoprueba.html
          node <<'NODE'
          const fs = require('fs');
          const h = fs.readFileSync('/tmp/autoprueba.html', 'utf8');
          const m = h.match(/data-autotest="([^"]+)"/);
          if (!m) throw new Error('La autoprueba no terminó o no publicó resultado.');
          const dato = m[1].replace(/&quot;/g, '"').replace(/&amp;/g, '&');
          const r = JSON.parse(dato);
          if (r.fallos.length) throw new Error('Autoprueba fallida: ' + r.fallos.join(', '));
          if (!r.preguntas || !r.legadosDeclarados || r.migraciones !== r.legadosDeclarados ||
              !r.fichasDeclaradas || r.migracionesFichas !== r.fichasDeclaradas ||
              r.casosBarajado !== r.preguntas * 20) {
            throw new Error('La autoprueba no cubrió todo el banco: ' + JSON.stringify(r));
          }
          console.log(`✔ 30.000 psicotécnicos, ${r.casosBarajado} barajados y ${r.migraciones} migraciones sin fallos.`);
          NODE

      - name: Comprobar los artefactos offline
        run: |
          test -f dist/web/index.html
          test -f dist/web/sw.js
          test -f dist/Oposicion-Metro/EMPEZAR-AQUI.html
          node <<'NODE'
          const fs = require('fs');
          const h = fs.readFileSync('dist/web/index.html', 'utf8');
          const reglas = [
            [/<script\b[^>]*\bsrc\s*=/i, 'script src'],
            [/<(?:img|iframe|audio|video|source)\b[^>]*\bsrc\s*=\s*["'](?:https?:)?\/\//i, 'medio externo'],
            [/@import\s+(?:url\()?\s*["']?(?:https?:)?\/\//i, '@import externo'],
            [/url\(\s*["']?(?:https?:)?\/\//i, 'url externa'],
            [/\bfetch\s*\(/, 'fetch'], [/\bXMLHttpRequest\b/, 'XMLHttpRequest'],
            [/\b(?:WebSocket|EventSource)\s*\(/, 'conexión persistente'],
            [/\bimportScripts\s*\(/, 'importScripts'], [/\bimport\s*\(/, 'import dinámico']
          ];
          const fallos = reglas.filter(([re]) => re.test(h)).map(([, nombre]) => nombre);
          if (fallos.length) throw new Error('La app no es autocontenida: ' + fallos.join(', '));
          console.log('✔ HTML autocontenido y arranque web offline generado.');
          NODE

      - name: Resumen del contenido
        run: |
          node -e '
            const t = require("./contenido/temario.json"), b = require("./contenido/preguntas.json");
            const eps = t.partes.flatMap(p => p.epigrafes);
            const l = [
              "| Dato | Valor |", "|---|---|",
              `| Partes | ${t.partes.length} |`,
              `| Temas | ${eps.length} |`,
              `| Preguntas | ${b.preguntas.length} |`,
              `| Fichas | ${eps.reduce((a, e) => a + e.fichas.length, 0)} |`,
              `| Preguntas sin fuente | ${b.preguntas.filter(p => !p.fuente).length} |`
            ].join("\n");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## Contenido publicado\n\n" + l + "\n");
          '

      - name: Guardar el resultado para GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web

      - name: Guardar el mismo resultado para Cloudflare
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: dist/web
          include-hidden-files: true
          if-no-files-found: error

  desplegar-cloudflare:
    name: Publicar en Cloudflare Pages
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar el artefacto validado
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: dist/web

      - name: Publicar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/web --project-name=oposicion-metro --branch=production

      - name: Comprobar que la web responde
        run: |
          set -e
          esperadas=$(grep -o '"id":"p-' dist/web/index.html | wc -l | tr -d ' ')
          test "$esperadas" -gt 0 || { echo "✖ El artefacto validado no contiene preguntas"; exit 1; }
          for i in 1 2 3 4 5; do
            codigo=$(curl -sS -m 25 -o /tmp/web.html -w '%{http_code}' https://oposicion-metro.pages.dev/ || echo 000)
            [ "$codigo" = "200" ] && break
            echo "intento $i: HTTP $codigo"; sleep 10
          done
          test "$codigo" = "200" || { echo "✖ La web no responde (HTTP $codigo)"; exit 1; }
          n=$(grep -o '"id":"p-' /tmp/web.html | wc -l | tr -d ' ')
          test "$n" = "$esperadas" || { echo "✖ La web sirve $n preguntas, el artefacto validado contiene $esperadas"; exit 1; }
          echo "✔ Cloudflare responde y sirve las $n preguntas validadas."

  publicar-en-github:
    name: Publicar en GitHub Pages
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Recuperar una referencia del artefacto validado
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: dist/web

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v5

      - name: Comprobar que responde
        run: |
          set -e
          esperadas=$(grep -o '"id":"p-' dist/web/index.html | wc -l | tr -d ' ')
          test "$esperadas" -gt 0 || { echo "✖ El artefacto validado no contiene preguntas"; exit 1; }
          url="${{ steps.despliegue.outputs.page_url }}"
          for i in 1 2 3 4 5 6; do
            codigo=$(curl -sSL -m 25 -o /tmp/gh.html -w '%{http_code}' "$url" || echo 000)
            [ "$codigo" = "200" ] && break
            echo "intento $i: HTTP $codigo"; sleep 15
          done
          test "$codigo" = "200" || { echo "✖ No responde (HTTP $codigo)"; exit 1; }
          n=$(grep -o '"id":"p-' /tmp/gh.html | wc -l | tr -d ' ')
          test "$n" = "$esperadas" || { echo "✖ GitHub sirve $n preguntas, el artefacto validado contiene $esperadas"; exit 1; }
          echo "✔ GitHub Pages responde y sirve las $n preguntas validadas."
